name: Release

on:
  push:
    tags:
      - 'v*' # Memicu workflow saat ada tag baru (v1.0.0, v1.2.3, dll)

permissions:
  contents: write # Wajib agar bisa membuat GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PENTING: Ambil semua history git untuk generate changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Sesuaikan dengan versi Go di go.mod Anda

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
