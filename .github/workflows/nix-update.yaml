name: Auto-update Flake on Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to pin (for example v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to pin (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nix-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-nix:
    name: Update flake version and hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "error: no release tag provided" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Update version, source hash, and vendorHash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --version="$VERSION" \
            default

      - name: Verify flake build
        run: nix build .#default --no-link --print-build-logs

      - name: Commit and push
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git diff --quiet -- flake.nix flake.lock; then
            echo "flake already up to date for $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "chore(flake): update to $TAG [skip ci]"
          git push
